# yaml-language-server: $schema=https://schema.blue-build.org/modules/dnf-v1.json
---
type: dnf
repos:
  files:
    - "https://github.com/terrapkg/subatomic-repos/raw/main/terra.repo"
  copr:
    - c0mpile/builds
    - atim/starship
    - scottames/ghostty
    - dejan/lazygit
    - lihaohong/yazi
    - lionheartp/Hyprland
   
  keys:
    - https://repos.fyralabs.com/terra44/key.asc
install:
  packages:
    # noctalia.dev
    # Umbriel (Window Manager), Noctalia (Shell), and greeter
    - umbriel-git
    - xdg-desktop-portal-umbriel-git
    - noctalia
    - noctalia-greeter

    # Utilities
    - podman-compose
    - podman-machine
    - podman-tui

    # Terminal
    - ghostty
    - ghostty-fish-completion
    - ghostty-nautilus
    - ghostty-shell-integration
    - ghostty-terminfo
    - starship
    - helix
    - yazi
    - lazygit
    - nix


remove:
  auto-remove: true
  packages:
    - firefox
    - firefox-langpacks # also remove firefox dependency (not required for all packages, this is a special case)

...
